name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # rustc 1.97.1 races on this dependency graph when Cargo builds many test
  # targets in parallel (intermittent "crate X required to be available in
  # rlib format"). Cap jobs and disable incremental so check/test artifacts
  # cannot get out of sync. Locally, `cargo test -j 1` is the fully-verified
  # invocation.
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
  # WebView2 COM bindings (compat-webview2) plus deep debug-JS page recursion
  # (see MAX_CALL_DEPTH in javascript.rs) overflow smaller worker stacks;
  # 64 MB is the validated floor for full release and all-target codegen.
  RUST_MIN_STACK: 67108864

jobs:
  quality:
    name: Quality and tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Test every target (builds all targets once; jobs capped in env)
        run: cargo test --all-targets --locked -j 1
      - name: Audit dependency license metadata
        shell: pwsh
        run: ./tools/audit-licenses.ps1
      - name: Audit RustSec vulnerabilities
        shell: pwsh
        run: ./tools/audit-rustsec.ps1
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -j 1 -- -D warnings
      - name: Compatibility backend tests
        run: cargo test --lib --features compat-webview2 --locked -j 1

  release:
    name: Release artifact
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build release
        run: cargo build --release --locked -j 1 --features compat-webview2
      - name: Release smoke
        shell: pwsh
        run: ./tools/release-smoke.ps1
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "ISCC.exe was not found after installing Inno Setup"
          }
      - name: Package release artifacts
        shell: pwsh
        run: ./packaging/package.ps1 -SkipBuild
      - name: Generate frozen source manifest
        shell: pwsh
        run: ./tools/make-source-manifest.ps1 -OutputPath ./source-freeze.json -ReleaseVersion $env:RELEASE_VERSION
      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: Sylphra-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/Sylphra-v${{ steps.version.outputs.version }}-windows-x64.zip
            dist/Sylphra-v${{ steps.version.outputs.version }}-windows-x64.zip.sha256
            dist/Sylphra-v${{ steps.version.outputs.version }}-Setup.exe
            dist/Sylphra-v${{ steps.version.outputs.version }}-Setup.exe.sha256
          if-no-files-found: error
      - name: Upload release evidence (freeze manifest)
        uses: actions/upload-artifact@v7
        with:
          name: sylphra-release-evidence
          path: |
            source-freeze.json
            source-freeze.json.sha256.txt
          if-no-files-found: error

  evidence-verify:
    name: Verify release evidence
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v7
        with:
          name: Sylphra-${{ needs.release.outputs.version }}-windows-x64
      - name: Download release evidence
        uses: actions/download-artifact@v7
        with:
          name: sylphra-release-evidence
      - name: Verify artifact and manifest checksums
        run: |
          sha256sum -c "Sylphra-v${{ needs.release.outputs.version }}-windows-x64.zip.sha256"
          sha256sum -c "Sylphra-v${{ needs.release.outputs.version }}-Setup.exe.sha256"
          sha256sum -c source-freeze.json.sha256.txt
